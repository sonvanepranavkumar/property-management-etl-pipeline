name: Property Management ETL - CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark==3.5.3 delta-spark==3.2.1

      - name: Run tests
        run: |
          pytest

  deploy:
    name: Deploy to Databricks
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DATABRICKS_HOST: ${{ secrets.PROPERTY_MANAGEMENT_ETL_DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.PROPERTY_MANAGEMENT_ETL_DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Check Databricks connection
        run: databricks current-user me

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy
          cp notebooks/*.py deploy/
          cp src/*.py deploy/

      - name: Upload files to Databricks
        run: |
          databricks workspace mkdirs "${{ vars.PROPERTY_MANAGEMENT_ETL_WORKSPACE_PATH }}"
          databricks workspace import-dir deploy "${{ vars.PROPERTY_MANAGEMENT_ETL_WORKSPACE_PATH }}" --overwrite
