name: Property Management ETL - CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark==3.5.3 delta-spark==3.2.1

      - name: Run tests
        run: |
          pytest tests/

  deploy:
    name: Deploy to Databricks
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DATABRICKS_HOST: ${{ secrets.PROPERTY_MANAGEMENT_ETL_DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.PROPERTY_MANAGEMENT_ETL_DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Databricks connection
        run: databricks current-user me

      - name: Upload notebooks
        run: |
          databricks workspace mkdirs "${{ vars.PROPERTY_MANAGEMENT_ETL_WORKSPACE_PATH }}/notebooks"
          databricks workspace import-dir notebooks "${{ vars.PROPERTY_MANAGEMENT_ETL_WORKSPACE_PATH }}/notebooks" --overwrite

      - name: Upload Python modules
        run: |
          databricks workspace mkdirs "${{ vars.PROPERTY_MANAGEMENT_ETL_WORKSPACE_PATH }}/src"
          databricks workspace import-dir src "${{ vars.PROPERTY_MANAGEMENT_ETL_WORKSPACE_PATH }}/src" --overwrite
