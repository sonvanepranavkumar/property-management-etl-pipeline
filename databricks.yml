bundle:
  name: property-management-etl-pipeline

resources:
  jobs:
    property_management_etl_pipeline:
      name: Property Management ETL Pipeline

      tasks:
        - task_key: properties_etl
          notebook_task:
            notebook_path: ./01_properties_etl.ipynb

        - task_key: tenants_etl
          notebook_task:
            notebook_path: ./02_tenants_etl.ipynb

        - task_key: rent_payments_etl
          notebook_task:
            notebook_path: ./03_rent_payments_etl.ipynb

        - task_key: expenses_etl
          notebook_task:
            notebook_path: ./04_expenses_etl.ipynb

        - task_key: property_management_analytics
          depends_on:
            - task_key: properties_etl
            - task_key: tenants_etl
            - task_key: rent_payments_etl
            - task_key: expenses_etl
          notebook_task:
            notebook_path: ./05_property_management_analytics.ipynb
